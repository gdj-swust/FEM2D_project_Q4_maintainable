# FEM2D CI — 矩阵/步骤决策记录见 docs/ci.md (2026-08-03 重写).
#
# 三个 job:
#   lint       — 静态检查 (compileall/ruff/mypy) + 独立自检, 无 gmsh, 跑一次
#   test-core  — 矩阵 4 组合; 显式卸载 gmsh, 确定性验证"无 gmsh →
#                gmsh 依赖测试 skip 而非失败" (与 runner 镜像无关)
#   test-full  — 最新栈 (3.13) + libGLU → gmsh Python API 可用, 全量测试
#
# 所有 job 都无 tools/gmsh.exe (86MB 可执行文件 gitignore 不入库) →
# 依赖捆绑可执行文件的测试 (test_geo_models) 在所有 job 恒定 skip。
"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q fem2d scripts tests run.py run_demo.py
      - name: ruff
        run: ruff check fem2d/ scripts/ tests/ run.py run_demo.py
      - name: mypy
        run: mypy fem2d/
      - name: vulture (dead code scan)
        # 防死代码常驻门禁 (2026-08-04 启用): 本地基线 0 命中
        # (fem2d scripts --min-confidence 100)。新增未引用代码 → 红灯。
        run: vulture fem2d scripts --min-confidence 100
      - name: Self-test (standalone patch test, no gmsh needed)
        run: python run.py --self-test

  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # numpy==2.0 = pyproject 声明的最低版 (numpy 2.0 只有到
          # Python 3.12 的 wheel, 3.13 起需 numpy>=2.1 → 地板组合放 3.11)
          - python-version: "3.11"
            numpy-constraint: "==2.0"
          - python-version: "3.11"
            numpy-constraint: ">=2.0,<3"
          - python-version: "3.12"
            numpy-constraint: ">=2.0,<3"
          - python-version: "3.13"
            numpy-constraint: ">=2.0,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "numpy${{ matrix.numpy-constraint }}"
      - name: Force gmsh-less environment (skip-path check)
        # gmsh 是声明的运行时依赖, wheel 安装必然成功; 本 job 要确定性
        # 验证无 gmsh 环境的 skip 行为, 与 runner 镜像是否预装 libGLU 无关
        # (tests/ 模块级 pytest.skip 捕 ImportError/OSError, gmsh_adapter
        # 懒加载, 见 docs/ci.md)。
        run: |
          python -m pip uninstall -y gmsh
          if python -c "import gmsh" 2>/dev/null; then
            echo "gmsh unexpectedly importable" >&2
            exit 1
          else
            echo "OK: gmsh unavailable — gmsh-dependent tests must skip"
          fi
      - name: pytest (gmsh-dependent tests expected to skip)
        run: python -m pytest -q

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system libGLU (gmsh Python API)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest (gmsh API available)
        run: python -m pytest -q -rs
      - name: pytest with coverage gate (fail_under=90, pyproject)
        # 防死代码/防静默常驻门禁: 覆盖率低于 90% 即失败 (test_geo_models
        # 在此 job 也 skip — 无 gmsh.exe — 与本地 93% 基线的差距即此)。
        run: python -m pytest -q --cov=fem2d
      - name: Regression drift gate (vs pinned baseline, rel < 1e-9)
        # 终轮回归数值漂移门 (2026-08-04): 确定性手写 MSH 2.2 网格 +
        # 钉死基线 (Windows 本地录制) — 求解链路任何 >1e-9 相对漂移即红。
        # 需 gmsh API (import_msh 无条件走 _gmsh_session) → 本 job 有。
        run: |
          cat > _ci_drift.msh <<'MSHEOF'
          $MeshFormat
          2.2 0 8
          $EndMeshFormat
          $Nodes
          4
          1 0 0 0
          2 1 0 0
          3 1 1 0
          4 0 1 0
          $EndNodes
          $Elements
          2
          1 2 2 1 1 1 2 3
          2 2 2 1 1 1 3 4
          $EndElements
          MSHEOF
          python - <<'PYEOF'
          import re
          import subprocess
          import sys

          out = subprocess.run(
              [sys.executable, "scripts/regression_compare.py",
               "_ci_drift.msh", "2.1e11", "0.3", "0.01", "1e6", "0.0",
               "elimination"],
              capture_output=True, text=True, check=True).stdout
          m = re.search(
              r"max\|u\|=([0-9.eE+-]+) energy=([0-9.eE+-]+) "
              r"eta=([0-9.eE+-]+) sxmax=([0-9.eE+-]+) "
              r"symax=([0-9.eE+-]+) txymax=([0-9.eE+-]+)", out)
          assert m, f"regression_compare 输出无法解析: {out!r}"
          got = [float(v) for v in m.groups()]
          expected = [4.8551138165e-06, 2.2668188447e-02, 1.5523972662e+01,
                      1.0279627164e+06, 2.9161118509e+05, 2.7962716378e+04]
          rel = max(abs(a - b) / abs(b) for a, b in zip(got, expected))
          print(f"regression drift vs pinned baseline: max rel = {rel:.3e}")
          assert rel < 1e-9, f"数值漂移: max rel = {rel:.3e}"
          PYEOF

  test-wheel:
    # 安装路径冒烟 (2026-08-05 发布链路轮 6a): 其余 job 均 `pip install -e`
    # (测源码路径) — wheel 缺包会被源码树掩盖。本 job 构建 wheel、在源码树外
    # 的临时目录安装, 锁定"安装后 import + 最小求解"链路; 不需要 gmsh。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Wheel content gate (boundary subpackages must ship)
        # 显式 packages 列表曾漏 fem2d.boundary.detectors/plugins — 任何工具链
        # 下缺包即红, 不依赖 build 后端的 manifest 自愈行为。
        run: |
          python - <<'PYEOF'
          import glob
          import zipfile
          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          for sub in ("fem2d/boundary/detectors/", "fem2d/boundary/plugins/"):
              assert any(n.startswith(sub) for n in names), f"wheel 缺 {sub}"
          print("wheel content OK: detectors + plugins present")
          PYEOF
      - name: Install wheel outside source tree
        run: |
          mkdir -p "$RUNNER_TEMP/wheelsmoke"
          python -m venv "$RUNNER_TEMP/wheelsmoke/venv"
          "$RUNNER_TEMP/wheelsmoke/venv/bin/python" -m pip install \
              --force-reinstall "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Smoke (import + minimal solve, cwd outside source tree)
        # cwd 在 $RUNNER_TEMP (checkout 之外) — 源码路径不会掩盖安装路径
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelsmoke/venv/bin/python" - <<'PYEOF'
          import numpy as np
          import fem2d
          import fem2d.boundary.detectors
          import fem2d.boundary.plugins
          import scripts.geo_spec
          print(fem2d.registered_element_types())
          from fem2d import Mesh, solve
          nodes = np.array([[0, 0], [1, 0], [1, 1], [0, 1]], dtype=float)
          elems = np.array([[0, 1, 2, 3]], dtype=int)
          mesh = Mesh(nodes, elems, E=2.1e11, nu=0.3,
                      thickness=0.01, elem_type="CPS4")
          mesh.fix_node(0)
          mesh.fix_node(1)
          mesh.add_force(2, 0.0, 1e6)
          result = solve(mesh, verbose=False)
          assert np.all(np.isfinite(result["u"])), "位移非有限"
          print("wheel smoke OK: max|u| =", float(np.max(np.abs(result["u"]))))
          PYEOF
