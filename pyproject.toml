# FEM2D 打包配置 (2026-08-02 补充 — 审计指出缺少 pyproject.toml).
#
# 本项目以源码运行为主 (python run.py), 本文件使:
#   - 依赖/工具链 (pytest/ruff) 声明集中一处, 替代 requirements.txt 的口头约定
#   - `pip install -e .` 开发安装可用 (import fem2d + scripts 均解析)
#   - `pytest` / `ruff` 无需额外命令行参数
#
# 注意: Gmsh 双路径 (子进程 gmsh.exe + Python API) 的 gmsh.exe 位于
# tools/ (不打包, 见 ARCHITECTURE.md 打包规则); Python 包 gmsh 为
# 运行时依赖, 其原生库 (Linux 需 libGLU.so.1) 由系统环境提供。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fem2d-q4"
version = "9.25.0"
description = "2D displacement FEM solver — CST/Q4/Q4R/Q4I, plane stress/strain, Gmsh mesh input"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# 版本下限 = 首个兼容 numpy 2.x 的发行版 (矩阵决策记录见 docs/ci.md):
#   numpy>=2.0      — 声明最低版; 代码只用 np.ptp 顶层函数 (numpy 2.0 只
#                     移除 arr.ptp() 方法, 顶层函数保留), 无已删别名
#                      (np.float_/np.NaN 等 — grep 全库 0 命中)
#   scipy>=1.13.0   — 首个支持 numpy 2.0 的 scipy (1.12 与 numpy 2.x 不兼容)
#   matplotlib>=3.8.4 — 首个支持 numpy 2.0 的 matplotlib (3.5 会崩)
# 注意: gmsh 是运行时依赖, 其 Python API 在 Linux 需系统 libGLU.so.1
# (CI 用 apt-get install libglu1-mesa, 见 docs/ci.md); 无 gmsh 时
# 相关测试按设计 skip 而非失败。
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.4",
    "gmsh>=4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4",   # docs/coverage.md 的 `--cov=fem2d` 复现 (全新 [dev] 环境)
    "ruff>=0.4",
    "mypy>=1.10",
    "vulture>=2.7",
    "bandit>=1.7",
]

# CLI 入口: pip install 后直接 `fem2d <input.geo>` 可用 (编码安全网在
# runner.main 内); 根目录 run.py 仍保留为源码运行方式
[project.scripts]
fem2d = "fem2d.runner:main"

[tool.setuptools.packages.find]
# 自动发现而非显式列表 — 显式列表曾漏掉 fem2d.boundary.detectors 与
# fem2d.boundary.plugins, 构建的 wheel 安装后 import 直接 ModuleNotFoundError。
# 发现规则只认含 __init__.py 的目录, 因此 tools/ (纯数据, 无 __init__.py)
# 天然不打包; include 白名单保证 tests/ 等未来新增包不会混入 wheel。
include = ["fem2d*", "scripts*"]


[tool.setuptools.data-files]
# 示例模型随 wheel 分发 (安装到 site-packages 旁的 fem2d-models/)
"fem2d-models" = ["models/*.geo", "models/*.spec", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
xfail_strict = true
markers = [
    "parametrize: 参数化用例 (pytest 内建, 显式登记便于检索)",
    "skip: 无条件跳过 (pytest 内建, 显式登记便于检索)",
    "skipif: 条件跳过 (pytest 内建, 显式登记便于检索)",
    "xfail: 预期失败 (pytest 内建, 显式登记便于检索)",
]

# 规则口径: E/F 错误级 (历史基线 0 错误)。其余规则组 (I/SIM/UP/BLE 等)
# 历史代码大量命中, 不开启以免全规则检查被风格噪音淹没。
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # 脚本模式: sys.path 注入后 import
    "E501",  # 行长 (历史代码)
    "E701",  # 一行复合语句 (历史风格)
    "E702",  # 分号多语句 (历史风格)
    "E722",  # bare except (历史)
    "E731",  # lambda 赋值 (历史)
    "E741",  # 截面惯矩 I 是数学约定变量名
]

# 默认命令 (mypy 无参数) 直接可达 0 错误 — files 限定 fem2d (scripts 为
# 脚本模式, 单独跑时用 --ignore-missing-imports); scipy/gmsh 无类型存根
[tool.mypy]
files = ["fem2d"]
# 历史类型标注不精确项 (field(default=None)、动态属性等) — 0 错误基线
disable_error_code = [
    "arg-type", "union-attr", "attr-defined",
    "assignment", "var-annotated", "no-redef",
]

[[tool.mypy.overrides]]
# scipy/gmsh 无类型存根
module = ["scipy.*", "gmsh"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scripts.* 是脚本模式 (部分包相对导入), 跟随检查时忽略模块解析
module = ["scripts.*"]
disable_error_code = ["import-not-found", "import-untyped"]

# 覆盖率硬门 (2026-08-04): 任何 `pytest --cov=fem2d` 运行 (本地或 CI) 低于
# 此值即失败。基线 93% (docs/coverage.md, 含 gmsh.exe 用例); 90 给 CI
# 无 gmsh.exe (test_geo_models 恒定 skip) 留余量。防死代码/防静默的常驻门禁。
[tool.coverage.report]
fail_under = 90
